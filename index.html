<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نبهني | Nabihni - تنبيه صاحب السيارة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #161616;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #ff3333;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 25px;
        }
        .car-info {
            background: #222;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #ccc;
        }
        .car-info span {
            color: #fff;
            font-weight: bold;
        }
        .instruction {
            font-size: 15px;
            margin-bottom: 20px;
            color: #ddd;
        }
        .btn {
            display: block;
            width: 100%;
            background: #ff3333;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.98);
            background: #e02e2e;
        }
        .btn-secondary {
            background: #262626;
            color: #fff;
        }
        .btn-secondary:active {
            background: #333;
        }
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">نبهني</div>
        <div class="subtitle">Nabihni - Smart Car Alert</div>

        <div class="car-info">
            رقم الستيكر التعريفي: <span id="stickerId">NB-1004</span>
        </div>

        <div class="instruction">
            هل تحتاج إلى إبلاغ صاحب هذه السيارة بشكل سريع وسري؟ اختر نوع التنبيه أدناه:
        </div>

        <a href="#" onclick="sendAlert('عفواً، سيارتك قافلة عليّ الطريق وتعارض خروجي.')" class="btn">🚗 سيارتك قافلة الطريق</a>
        <a href="#" onclick="sendAlert('أضواء سيارتك الخارجية مشتعلة.')" class="btn btn-secondary">💡 أضواء السيارة مشتعلة</a>
        <a href="#" onclick="sendAlert('إطارات سيارتك تحتاج إلى تفقد / تأشر بصورة غير طبيعية.')" class="btn btn-secondary">⚠️ تنبيه أمني / الإطارات</a>
        <a href="#" onclick="sendAlert('أهلاً بك، لدي موضوع طارئ بخصوص سيارتك.')" class="btn btn-secondary">📞 موضوع طارئ آخر</a>

        <div class="footer">
            خصوصيتك محمية بالكامل • نظام نبهني الذكي
        </div>
    </div>

    <script>
        function sendAlert(message) {
            const ownerPhone = "9647800000000"; 
            const stickerCode = document.getElementById('stickerId').innerText;
            const fullMessage = `*تنبيه من براند نبهني (رقم الستيكر: ${stickerCode})*:\n\n${message}\n\nيرجى تفقد سيارتك فوراً.`;
            const encodedMessage = encodeURIComponent(fullMessage);
            const whatsappUrl = `https://wa.me/${ownerPhone}?text=${encodedMessage}`;
            window.location.href = whatsappUrl;
        }
    </script>

</body>
</html>
